name: Deploy to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # puppeteer is only used by bin/generate_cv_pdf, not by the build
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build
        run: pnpm build
        env:
          # CRA turns lint warnings into errors when CI=true
          CI: "false"

      # npx instead of cloudflare/wrangler-action: the action picks yarn because of the
      # old yarn.lock and fails installing wrangler into the pnpm node_modules
      - name: Deploy
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
